<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="648" viewBox="0 0 1280 648" role="img" aria-labelledby="title desc">
<title id="title">Какие функции вы хотели бы видеть на сайте-помощнике по выбору ноутбука для обучения?</title>
<desc id="desc">Опрос, 40 ответов, 19 октября 2026 года. Подбор ноутбука по бюджету: 25 (62,5%); Подбор по учебным задачам и специальности: 19 (47,5%); Рекомендации по необходимым техническим характеристикам: 18 (45%); Объяснение характеристик простым языком: 27 (67,5%); Сравнение нескольких моделей: 22 (55%); Рекомендации по соотношению цены и производительности: 18 (45%); Список подходящих моделей с указанием их преимуществ и недостатков: 20 (50%)</desc>
<rect width="1280" height="648" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#202b3d">
