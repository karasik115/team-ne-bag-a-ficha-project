<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="664" viewBox="0 0 1280 664" role="img" aria-labelledby="title desc">
<title id="title">С какими трудностями вы сталкиваетесь при выборе ноутбука для обучения?</title>
<desc id="desc">Опрос, 40 ответов, 19 октября 2026 года. Не понимаю, какие характеристики нужны для моих учебных задач: 13 (32,5%); Не знаю, какой производительности будет достаточно: 15 (37,5%); Сложно выбрать ноутбук в рамках своего бюджета: 9 (22,5%); Трудно сравнивать разные модели: 18 (45%); Боюсь переплатить за ненужные возможности: 14 (35%); Не знаю, какие модели подходят для специализированных программ: 6 (15%); Не испытываю трудностей при выборе: 8 (20%); Мама денег не дает: 1 (2,5%)</desc>
<rect width="1280" height="664" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#202b3d">
<text x="32" y="46" font-size="23" font-weight="bold">С какими трудностями вы сталкиваетесь при выборе ноутбука для обучения?</text>
<text x="32" y="74" font-size="17" fill="#526174">40 ответов · 19.10.2026 · Можно выбрать несколько вариантов</text>
<line x1="670.0" y1="121" x2="670.0" y2="581" stroke="#e6ebf0"/>
<text x="670.0" y="610" font-size="15" text-anchor="middle" fill="#526174">0</text>
<line x1="782.5" y1="121" x2="782.5" y2="581" stroke="#e6ebf0"/>
<text x="782.5" y="610" font-size="15" text-anchor="middle" fill="#526174">10</text>
<line x1="895.0" y1="121" x2="895.0" y2="581" stroke="#e6ebf0"/>
<text x="895.0" y="610" font-size="15" text-anchor="middle" fill="#526174">20</text>
<line x1="1007.5" y1="121" x2="1007.5" y2="581" stroke="#e6ebf0"/>
<text x="1007.5" y="610" font-size="15" text-anchor="middle" fill="#526174">30</text>
<line x1="1120.0" y1="121" x2="1120.0" y2="581" stroke="#e6ebf0"/>
<text x="1120.0" y="610" font-size="15" text-anchor="middle" fill="#526174">40</text>
<text x="32" y="163.5" font-size="19">Не понимаю, какие характеристики нужны для моих</text>
<text x="32" y="186.5" font-size="19">учебных задач</text>
<rect x="670" y="156.0" width="146.25" height="26" rx="4" fill="#3565a6"/>
<text x="828.25" y="175.0" font-size="18">13 (32,5%)</text>
<text x="32" y="234.0" font-size="19">Не знаю, какой производительности будет достаточно</text>
<rect x="670" y="215.0" width="168.75" height="26" rx="4" fill="#3565a6"/>
<text x="850.75" y="234.0" font-size="18">15 (37,5%)</text>
<text x="32" y="288.0" font-size="19">Сложно выбрать ноутбук в рамках своего бюджета</text>
<rect x="670" y="269.0" width="101.25" height="26" rx="4" fill="#3565a6"/>
<text x="783.25" y="288.0" font-size="18">9 (22,5%)</text>
<text x="32" y="342.0" font-size="19">Трудно сравнивать разные модели</text>
<rect x="670" y="323.0" width="202.5" height="26" rx="4" fill="#3565a6"/>
<text x="884.5" y="342.0" font-size="18">18 (45%)</text>
<text x="32" y="396.0" font-size="19">Боюсь переплатить за ненужные возможности</text>
<rect x="670" y="377.0" width="157.5" height="26" rx="4" fill="#3565a6"/>
<text x="839.5" y="396.0" font-size="18">14 (35%)</text>
<text x="32" y="443.5" font-size="19">Не знаю, какие модели подходят для специализированных</text>
<text x="32" y="466.5" font-size="19">программ</text>
<rect x="670" y="436.0" width="67.5" height="26" rx="4" fill="#3565a6"/>
<text x="749.5" y="455.0" font-size="18">6 (15%)</text>
<text x="32" y="514.0" font-size="19">Не испытываю трудностей при выборе</text>
<rect x="670" y="495.0" width="90.0" height="26" rx="4" fill="#3565a6"/>
<text x="772.0" y="514.0" font-size="18">8 (20%)</text>
<text x="32" y="568.0" font-size="19">Мама денег не дает</text>
<rect x="670" y="549.0" width="11.25" height="26" rx="4" fill="#3565a6"/>
<text x="693.25" y="568.0" font-size="18">1 (2,5%)</text>
<text x="670" y="641" font-size="15" fill="#526174">Количество участников, выбравших вариант</text>
</g></svg>
