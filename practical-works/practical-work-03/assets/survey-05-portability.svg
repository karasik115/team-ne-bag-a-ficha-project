<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="428" viewBox="0 0 1280 428" role="img" aria-labelledby="title desc">
<title id="title">Как часто вы планируете брать ноутбук с собой на учёбу?</title>
<desc id="desc">Опрос, 40 ответов, 19 октября 2026 года. Каждый день: 11 (27,5%); Несколько раз в неделю: 24 (60%); Несколько раз в месяц: 1 (2,5%); Редко, в основном буду пользоваться дома: 4 (10%)</desc>
