<text x="32" y="74" font-size="17" fill="#526174">40 ответов · 19.10.2026 · Один вариант ответа</text>
<line x1="670.0" y1="121" x2="670.0" y2="345" stroke="#e6ebf0"/>
<text x="670.0" y="374" font-size="15" text-anchor="middle" fill="#526174">0</text>
<line x1="782.5" y1="121" x2="782.5" y2="345" stroke="#e6ebf0"/>
<text x="782.5" y="374" font-size="15" text-anchor="middle" fill="#526174">10</text>
<line x1="895.0" y1="121" x2="895.0" y2="345" stroke="#e6ebf0"/>
<text x="895.0" y="374" font-size="15" text-anchor="middle" fill="#526174">20</text>
<line x1="1007.5" y1="121" x2="1007.5" y2="345" stroke="#e6ebf0"/>
<text x="1007.5" y="374" font-size="15" text-anchor="middle" fill="#526174">30</text>
<line x1="1120.0" y1="121" x2="1120.0" y2="345" stroke="#e6ebf0"/>
<text x="1120.0" y="374" font-size="15" text-anchor="middle" fill="#526174">40</text>
<text x="32" y="170.0" font-size="19">Каждый день</text>
<rect x="670" y="151.0" width="123.75" height="26" rx="4" fill="#3565a6"/>
<text x="805.75" y="170.0" font-size="18">11 (27,5%)</text>
